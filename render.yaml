services:
  # -------------------------------------------------------------
  # 1. MESSAGE BROKER (RabbitMQ)
  # -------------------------------------------------------------
  - type: pserv
    name: rabbitmq-service
    env: docker
    image:
      url: docker.io/library/rabbitmq:3-management
    plan: starter
    disk:
      name: rabbitmq-data
      mountPath: /var/lib/rabbitmq
      sizeGB: 10
    envVars:
      - key: RABBITMQ_DEFAULT_USER
        value: salon_user
      - key: RABBITMQ_DEFAULT_PASS
        generateValue: true

  # -------------------------------------------------------------
  # 2. REDIS DATABASE (Moved inside the services array)
  # -------------------------------------------------------------
  - type: redis
    name: salon-redis
    plan: free
    ipAllowList: [] # Allows internal networking access securely

  # -------------------------------------------------------------
  # 3. MICROSERVICES (Backend Web Services)
  # -------------------------------------------------------------
  - type: web
    name: api-gateway
    env: docker
    rootDir: server/apps/api-gateway
    plan: free
    numInstances: 1
    envVars:
      - key: PORT
        value: 5000
      - key: AUTH_SERVICE_URL
        value: http://auth-service:5001
      - key: SALON_SERVICE_URL
        value: http://salon-service:5002
      - key: PAYMENT_SERVICE_URL
        value: http://payment-service:5003
      - key: BOOKING_SERVICE_URL
        value: http://booking-service:5004
      - key: NOTIFICATION_SERVICE_URL
        value: http://notification-service:5005

  - type: web
    name: auth-service
    env: docker
    rootDir: server/apps/auth-service
    plan: free
    numInstances: 1
    envVars:
      - key: PORT
        value: 5001
      - fromGroup: salon-database-secrets
      - key: MONGO_URI
        value: ${MONGO_ATLAS_BASE_URL}/auth_db?retryWrites=true&w=majority
      - fromService:
          type: redis
          name: salon-redis
          property: connectionString
      - fromService:
          type: pserv
          name: rabbitmq-service
          property: host
        asVariable: RABBITMQ_HOST

  - type: web
    name: salon-service
    env: docker
    rootDir: server/apps/salon-service
    plan: free
    numInstances: 1
    envVars:
      - key: PORT
        value: 5002
      - fromGroup: salon-database-secrets
      - key: MONGO_URI
        value: ${MONGO_ATLAS_BASE_URL}/salon_db?retryWrites=true&w=majority
      - fromService:
          type: pserv
          name: rabbitmq-service
          property: host
        asVariable: RABBITMQ_HOST

  - type: web
    name: payment-service
    env: docker
    rootDir: server/apps/payment-service
    plan: free
    numInstances: 1
    envVars:
      - key: PORT
        value: 5003
      - fromGroup: salon-database-secrets
      - key: MONGO_URI
        value: ${MONGO_ATLAS_BASE_URL}/payment_db?retryWrites=true&w=majority
      - fromService:
          type: pserv
          name: rabbitmq-service
          property: host
        asVariable: RABBITMQ_HOST

  - type: web
    name: booking-service
    env: docker
    rootDir: server/apps/booking-service
    plan: free
    numInstances: 1
    envVars:
      - key: PORT
        value: 5004
      - fromGroup: salon-database-secrets
      - key: MONGO_URI
        value: ${MONGO_ATLAS_BASE_URL}/booking_db?retryWrites=true&w=majority
      - fromService:
          type: pserv
          name: rabbitmq-service
          property: host
        asVariable: RABBITMQ_HOST

  - type: web
    name: notification-service
    env: docker
    rootDir: server/apps/notification-service
    plan: free
    numInstances: 1
    envVars:
      - key: PORT
        value: 5005
      - fromGroup: salon-database-secrets
      - key: MONGO_URI
        value: ${MONGO_ATLAS_BASE_URL}/notification_db?retryWrites=true&w=majority
      - fromService:
          type: pserv
          name: rabbitmq-service
          property: host
        asVariable: RABBITMQ_HOST

# -------------------------------------------------------------
# 4. SHARED ENV GROUPS (For MongoDB Base URL)
# -------------------------------------------------------------
envVarGroups:
  - name: salon-database-secrets
    envVars:
      - key: MONGO_ATLAS_BASE_URL
        sync: false
